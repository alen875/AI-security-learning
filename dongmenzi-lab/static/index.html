<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>东门子虚构设备维护训练靶场</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><h1>东门子设备维护训练靶场</h1><p>虚构教学数据 · 不连接工业设备</p><div id="mode"></div></header>
<main><section id="login-panel"><h2>登录</h2><form id="login-form"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
<section id="workspace" hidden><p id="identity"></p><button id="logout">退出</button><h2>模拟设备</h2><button id="refresh">刷新设备</button><div id="devices" aria-live="polite"></div><h2>维护记录详情</h2><label>预置记录编号<input id="record-id" type="number" min="1" value="1"></label><button id="load-record">读取记录</button><pre id="record"></pre><section id="bp-panel" hidden><h2>T3 BP 请求参数篡改</h2><p>页面只发送普通维护预览。可在获批的隔离环境用 Burp Suite 拦截请求，将客户端提交的预览角色改为复核员，比较教学状态与修复状态。本练习只读取虚构培训摘要。</p><button id="bp-inspect">预览普通维护报告</button><pre id="bp-result"></pre></section><h2>教学检索</h2><label>索引编号<input id="query" value="1" maxlength="80"></label><button id="search">检索</button><div id="results" aria-live="polite"></div><section id="audit-panel" hidden><h2>审计</h2><button id="load-audit">查看最近事件</button><pre id="audit"></pre></section><section id="admin-panel" hidden><h2>恢复基线</h2><button id="reset">重置虚构业务数据</button></section></section><p id="notice" role="status"></p></main><script src="/static/app.js" defer></script></body></html>
